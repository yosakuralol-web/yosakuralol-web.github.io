<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yosakura - Sign Up</title>

<style>
@keyframes slideInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://i.postimg.cc/W4qLWspg/Nouveau-projet-(1).png') no-repeat center center fixed;
    background-size: cover;
    display: flex; justify-content: center; align-items: center;
}

.page-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1;
}

.auth-card {
    background: rgba(255, 255, 255, 0.005);
    backdrop-filter: blur(20px); 
    width: 380px;
    padding: 80px 45px;
    border-radius: 20px;
    border: 1px solid rgba(85, 122, 46, 0.25);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
    position: relative;
    z-index: 2;
    color: white;
}

.reveal { opacity: 0; animation: slideInDown 0.8s cubic-bezier(0.2, 1, 0.2, 1) forwards; }
.del-1 { animation-delay: 0.1s; }
.del-2 { animation-delay: 0.3s; }
.del-3 { animation-delay: 0.5s; }
.del-4 { animation-delay: 0.7s; }
.del-5 { animation-delay: 0.9s; }
.del-6 { animation-delay: 1.1s; }
.del-7 { animation-delay: 1.3s; }

.title { 
    font-size: 32px; 
    font-weight: 800; 
    margin-bottom: 15px; 
    color: #557a2e; 
    text-shadow: 0 0 15px rgba(85, 122, 46, 0.3); 
    letter-spacing: -0.5px;
}

.subtitle { color: #ccc; font-size: 13px; margin-bottom: 45px; line-height: 1.6; }

.input-group { text-align: left; margin-bottom: 24px; }
.input-label { display: block; font-size: 11px; color: #aaa; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

.form-input {
    width: 100%; padding: 15px; 
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.03); 
    border-radius: 12px; 
    color: white;
    box-sizing: border-box; 
    outline: none; 
    transition: 0.3s; 
    font-size: 14px;
}
.form-input:focus { border-color: rgba(85, 122, 46, 0.3); background: rgba(0, 0, 0, 0.5); }

.submit-btn {
    width: 100%; padding: 16px; 
    background: rgba(85, 122, 46, 0.05); 
    color: #557a2e;
    border: 1px solid rgba(85, 122, 46, 0.3);
    border-radius: 12px; 
    font-weight: 800; 
    font-size: 14px;
    cursor: pointer; 
    margin-top: 30px; 
    transition: all 0.3s ease;
}
.submit-btn:hover { 
    background: rgba(85, 122, 46, 0.1); 
    color: #7bab49; 
    transform: translateY(-2px);
}

.footer-link { color: #bbb; font-size: 12px; margin-top: 30px; display: block; text-decoration: none; }
.footer-link span { color: #557a2e; font-weight: bold; }

/* Nouvelle classe pour les erreurs */
.error-msg {
    color: #ff4c4c;
    font-size: 13px;
    margin-top: 12px;
    font-weight: 700;
    display: none; /* invisible par défaut */
    text-align: center;
}
</style>
</head>

<body>

<div class="page-overlay"></div>

<div class="auth-card">

    <h2 class="title reveal del-1">Sign Up</h2>
    <p class="subtitle reveal del-2">Secure your digital identity with Yosakura.</p>

    <div class="input-group reveal del-3">
        <label class="input-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Choose a username">
    </div>

    <div class="input-group reveal del-4">
        <label class="input-label">E-Mail</label>
        <input type="email" id="email" class="form-input" placeholder="name@example.com">
    </div>

    <div class="input-group reveal del-5">
        <label class="input-label">Password</label>
        <input type="password" id="pass" class="form-input" placeholder="Minimum 6 characters">
    </div>

    <button class="submit-btn reveal del-6" id="signupBtn">Create Account</button>

    <div id="errorMsg" class="error-msg"></div>

    <a href="/login" class="footer-link reveal del-7">
        Already have an account? <span>Login</span>
    </a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { 
    apiKey: "AIzaSyC8hhDek0GuNk8y9e23l8lGf4PQ2cj_Hzc",
  authDomain: "fir-deffe.firebaseapp.com",
  projectId: "fir-deffe",
  storageBucket: "fir-deffe.firebasestorage.app",
  messagingSenderId: "758364730866",
  appId: "1:758364730866:web:feae96430aa5b8512da76b",
  measurementId: "G-SZ7H9QLL99"
};

const auth = getAuth(initializeApp(firebaseConfig));
const errorMsg = document.getElementById('errorMsg');

document.getElementById('signupBtn').onclick = async () => {
    errorMsg.style.display = "none"; // cacher l'erreur précédente
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;

    if (!username) {
        errorMsg.textContent = "Veuillez choisir un nom d'utilisateur.";
        errorMsg.style.display = "block";
        return;
    }

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(userCredential.user, { displayName: username });
        window.location.href = "index.html";
    } catch (e) {
        errorMsg.textContent = e.message;
        errorMsg.style.display = "block";
    }
};
</script>

</body>
</html>
