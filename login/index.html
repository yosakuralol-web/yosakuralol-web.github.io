<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yosakura - Login</title>

<style>
@keyframes slideInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 200;
    background: url('https://i.postimg.cc/W4qLWspg/Nouveau-projet-(1).png') no-repeat center center fixed;
    background-size: cover;
    display: flex; justify-content: center; align-items: center;
}

.page-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1;
}

.auth-card {
    background: rgba(255, 255, 255, 0.005);
    backdrop-filter: blur(3px); 
    width: 380px;
    padding: 130px 35px 30px 35px;
    border-radius: 20px;
    border: 1px solid rgba(85, 122, 46, 0.25);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
    position: relative;
    z-index: 2;
    color: white;
}

.reveal { opacity: 0; animation: slideInDown 0.8s cubic-bezier(0.2, 1, 0.2, 1) forwards; }
.del-1 { animation-delay: 0.1s; }
.del-2 { animation-delay: 0.3s; }
.del-3 { animation-delay: 0.5s; }
.del-4 { animation-delay: 0.7s; }
.del-5 { animation-delay: 0.9s; }
.del-6 { animation-delay: 1.1s; }
.del-7 { animation-delay: 1.3s; }

.site-logo {
    position: absolute;
    top: -200px;      
    left: 50%;
    transform: translateX(-50%);
    width: 300px;     
    height: auto;
}

.subtitle { color: #ccc; font-size: 13px; margin-bottom: 45px; line-height: 1.6; }

.input-group { text-align: left; margin-bottom: 24px; position: relative; }
.input-label { display: block; font-size: 11px; color: #aaa; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

.input-group img {
    position: absolute;
    left: 8px; top: 65%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    pointer-events: none;
    filter: invert(70%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(90%) contrast(100%);
}

.form-input {
    width: 100%; padding: 15px 15px 15px 40px; 
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.03); 
    border-radius: 12px; 
    color: white;
    box-sizing: border-box; 
    outline: none; 
    transition: 0.3s; 
    font-size: 14px;
}
.form-input:focus { 
    border-color: rgba(255, 255, 255, 0.03); 
    background: rgba(0, 0, 0, 0.3);
}

.submit-btn {
    width: 100%; padding: 16px; 
    background: rgba(85, 122, 46, 0.05); 
    color: #274c00;
    border: 1px solid rgba(85, 122, 46, 0.3);
    border-radius: 12px; 
    font-size: 14px;
    cursor: pointer; 
    margin-top: 30px; 
    transition: all 0.3s ease;
}
.submit-btn:hover { 
    background: rgba(85, 122, 46, 0.1); 
    color: #7bab49; 
    transform: translateY(-2px);
}

.footer-link { color: #bbb; font-size: 12px; margin-top: 30px; display: block; text-decoration: none; }
.footer-link span { color: #557a2e; font-weight: bold; }

.error-msg {
    color: #ff4c4c;
    font-size: 13px;
    margin-top: 12px;
    font-weight: 700;
    display: none; 
    text-align: center;
}
</style>
</head>

<body>

<div class="page-overlay"></div>

<div class="auth-card">

    <!-- Logo en haut -->
    <h2 class="title reveal del-1">
        <img src="https://i.postimg.cc/cHMDXLj7/Gemini-Generated-Image-fa34i6fa34i6fa34-removebg-preview.png" alt="Yosakura Logo" class="site-logo">
    </h2>

    <p class="subtitle reveal del-2">Sign in to your Yosakura account.</p>

    <!-- Email -->
    <div class="input-group reveal del-3">
        <label class="input-label">E-Mail</label>
        <img src="https://i.postimg.cc/J0zmvs5F/54e08a3e14e15db066d18a08ddae654b-removebg-preview.png" alt="icon">
        <input type="email" id="email" class="form-input" placeholder="name@example.com">
    </div>

    <!-- Password -->
    <div class="input-group reveal del-4">
        <label class="input-label">Password</label>
        <img src="https://i.postimg.cc/X7xxnpcg/a241bb614f4bcf37290656c7eff1bfb4-removebg-preview.png" alt="icon">
        <input type="password" id="pass" class="form-input" placeholder="Minimum 6 characters">
    </div>

    <button class="submit-btn reveal del-5" id="loginBtn">Login</button>

    <div id="errorMsg" class="error-msg"></div>

    <a href="/signup" class="footer-link reveal del-6">
        Don't have an account? <span>Sign Up</span>
    </a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

if (location.pathname.endsWith(".html")) {
    const cleanPath = location.pathname.replace(".html", "");
    history.replaceState(null, "", cleanPath);
}

const firebaseConfig = { 
    apiKey: "AIzaSyC8hhDek0GuNk8y9e23l8lGf4PQ2cj_Hzc",
    authDomain: "fir-deffe.firebaseapp.com",
    projectId: "fir-deffe",
    storageBucket: "fir-deffe.firebasestorage.app",
    messagingSenderId: "758364730866",
    appId: "1:758364730866:web:feae96430aa5b8512da76b",
    measurementId: "G-SZ7H9QLL99"
};

const auth = getAuth(initializeApp(firebaseConfig));
const errorMsg = document.getElementById('errorMsg');

document.getElementById('loginBtn').onclick = async () => {
    errorMsg.style.display = "none";
    try {
        await signInWithEmailAndPassword(
            auth,
            document.getElementById('email').value,
            document.getElementById('pass').value
        );
        window.location.href = "/";
    } catch (e) {
        errorMsg.textContent = "Incorrect credentials.";
        errorMsg.style.display = "block";
    }
};
</script>

</body>
</html>
